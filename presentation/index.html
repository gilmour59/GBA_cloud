:root{color-scheme:dark;--ink:#eef7ff;--muted:#a9bfce;--navy:#071423;--panel:#112b40;--line:#305268;--cyan:#60d9e3;--blue:#8baeff;--paper:#f2f7fa}*{box-sizing:border-box}body{margin:0;background:#030e19;color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}.stage{min-height:100dvh;display:grid;place-items:center;padding:38px 24px 72px}.slide{position:relative;width:min(1280px,calc((100dvh - 125px)*16/9),100%);aspect-ratio:16/9;background:var(--navy);border:1px solid #1e3a50;box-shadow:0 24px 64px #0009;overflow:hidden;padding:clamp(28px,5.1vw,82px);display:flex;flex-direction:column;justify-content:center;gap:clamp(18px,3vw,40px)}.slide:before{content:"";position:absolute;inset:0 auto 0 0;width:7px;background:var(--cyan)}.slide:after{content:"";position:absolute;right:-12%;top:-45%;width:44%;height:100%;border:1px solid #4fbcca29;border-radius:50%;pointer-events:none}.kicker{color:var(--cyan);font-size:clamp(10px,1.2vw,14px);font-weight:700;letter-spacing:.12em;text-transform:uppercase}.title{margin:0;font-size:clamp(30px,4.5vw,64px);font-weight:750;line-height:1.12;letter-spacing:-.035em;max-width:1080px;text-wrap:balance}.slide:not(.cover) .title{font-size:clamp(29px,3.65vw,51px)}.content{font-size:clamp(15px,1.8vw,26px);line-height:1.48;letter-spacing:-.006em;color:var(--muted);max-width:1060px}.item{margin:0 0 .52em}.item:last-child{margin-bottom:0}.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:14px;width:100%}.tile{min-height:120px;padding:24px 20px;border-top:2px solid var(--cyan);background:#153047;display:flex;flex-direction:column;justify-content:center;gap:12px;color:#f4fbff}.tile strong{font-size:clamp(15px,1.72vw,25px);line-height:1.17}.tile small{font-size:clamp(12px,1.25vw,17px);line-height:1.38;color:#c9dbe4}.flow{display:flex;align-items:stretch;gap:8px}.flow .tile{flex:1;min-width:0;align-items:center;padding:17px 5px;min-height:110px;text-align:cen </style></head><body><main id="app"></main><nav class="controls" aria-label="Slide navigation"><button id="prev" type="button" aria-label="Previous slide">← Previous</button><span id="count" class="counter"></span><button id="next" type="button" aria-label="Next slide">Next →</button><button id="toggle-notes" type="button" aria-pressed="false">Notes (N)</button><button id="open-presenter" class="presenter-launch" type="button" title="Open a synchronized presenter window">Presenter View (P)</button></nav><div id="progress" class="progress"></div><section id="presenter-shell" class="presenter-shell" aria-label="Presenter view"><header class="presenter-top"><h1 class="presenter-heading">WVSU MIT · Presenter View</h1><span class="presenter-time" id="presenter-clock">00:00</span></header><div class="presenter-main"><div class="presenter-previews"><article class="presenter-preview"><div class="preview-label">Current slide</div><h2 class="preview-title" id="current-title"></h2><div class="preview-summary" id="current-summary"></div></article><article class="presenter-preview"><div class="preview-label">Up next</div><h2 class="preview-title" id="upnext-title"></h2><div class="preview-summary" id="upnext-summary"></div></article></div><aside class="presenter-notes-pane"><div class="presenter-notes-heading">Speaking notes · scroll independently</div><div class="presenter-notes-body" id="presenter-notes"></div></aside></div><footer class="presenter-bottom"><button type="button" id="p-prev">← Previous</button><button type="button" id="p-next">Next →</button><button type="button" id="p-reset">Reset timer</button><span class="presenter-hint">← → to navigate · Esc to close</span><span class="presenter-counter" id="p-count"></span></footer></section><script>const SLIDE_DATA=[{"title":"Big Data Analytics and Cloud-Based Data Engineering","items":["WVSU · Master in Information Technology","Research-based discussion · Cloud architectures · Data pipelines · Applied analytics"],"kind":"cover","notes":"Good day, everyone. Our topic is Big Data Analytics and Cloud-Based Data Engineering. Today, we will follow data from the moment it is collected until it becomes information that helps an organization decide what to do. We will focus more on big data and engineering than on general cloud computing. We will also examine three research papers published in 2023 and 2025, asking not only what they propose but what their evidence actually supports. For a relatable example, imagine consolidating agricultural production data from different provinces. By the end, I hope we see that good analytics begins long before a dashboard is made. Let me start with what we should be able to explain after this discussion."},{"title":"Learning outcomes","items":["Explain Big Data and the 5 Vs","Distinguish data warehouse, lake, and lakehouse","Explain cloud data engineering pipelines","Critically compare three recent studies","Interpret a practical agricultural analytics workflow"],"kind":"list","notes":"These are our learning objectives. First, we should be able to explain why some datasets become difficult to manage using ordinary systems. Second, we will distinguish data warehouses, data lakes, and data lakehouses. Third, we will trace the work of data engineers—ingestion, transformation, validation, and orchestration. Fourth, we will critically examine three recent research studies instead of simply accepting their claims. Finally, we will connect these ideas to an agricultural analytics workflow that we can demonstrate later. You do not have to memorize every platform name. What matters is understanding why each component exists and what problem it solves. With those goals in mind, here is the question that connects the entire report."},{"title":"Our guiding question","items":["How can cloud-based data engineering turn large, messy datasets into reliable, actionable information?","From data collection → engineering → management → analytics → decisions"],"kind":"statement","notes":"Our guiding question is: how do we turn large, messy data into reliable information for decisions? Imagine getting separate spreadsheets from several offices. Some columns have different names, some records appear twice, and some entries are incomplete. Simply placing those files on a powerful server does not make them useful. They must be collected, understood, cleaned, organized, and analyzed. Cloud-based engineering gives us ways to run these steps repeatedly at different scales, but it does not automatically guarantee correctness. As we go through each technology and paper, I will return to this idea: where in the workflow does it help us build trust in the resulting information? We begin by defining the problem of Big Data."},{"title":"What is Big Data?","items":["Data whose scale, speed, diversity, or quality challenges traditional approaches","Volume","Velocity","Variety","Veracity","Value"],"kind":"five","notes":"When we say Big Data, we should not think only of a huge number of rows. A common way to describe it is through five Vs. Volume refers to how much data we have. Velocity is how quickly new data arrives or needs to be processed. Variety describes different formats—tables, images, sensor readings, and text. Veracity concerns the accuracy and reliability of records. Finally, value asks whether the data can produce meaningful insights. Consider an agricultural system: millions of farm records create volume; daily submissions create velocity; GPS files and photographs create variety; incorrect entries create veracity problems; and improved planning creates value. Different combinations of these challenges require different engineering solutions. Once we have the data, the next question is what kind of analysis we want to perform."},{"title":"What is Big Data Analytics?","items":["Descriptive — What happened?","Diagnostic — What factors may explain it?","Predictive — What may happen?","Prescriptive — Which action is preferable?","Define reliable measures before drawing conclusions"],"kind":"four","notes":"For the analytics to be useful, we first define a question, the level of aggregation, and how to interpret the outcome. For example, a province may have the highest recorded total production because it has more land cultivated, not necessarily because its productivity is higher. That is why we distinguish total output from yield per hectare. Descriptive analytics summarizes what happened; diagnostic analysis examines contributing factors; predictive analysis estimates future values under assumptions; and prescriptive analysis weighs possible actions. Our current fictional scenario can demonstrate aggregation and comparison, but it does not justify causal claims or predictive accuracy. This distinction matters before we move to the engineering infrastructure."},{"title":"How to analyze Big Data — a repeatable method","kind":"flow","items":["Ask","Profile","Prepare","Aggregate","Validate","Interpret","Communicate"],"notes":"Now let us answer a practical question: if someone hands us a large dataset, how exactly do we analyze it? We do not start by making a chart. First, define a decision question. Suppose we want to identify which province has the highest crop productivity. Second, profile the data: inspect column meanings, count records, check missing values and duplicates, and examine the units. Third, prepare the data by cleaning errors, standardizing commodity names and checking the time period. Fourth, calculate appropriate measures, such as production in metric tons divided by harvested area in hectares. Fifth, validate totals against sources and examine unexpected outliers. Sixth, interpret carefully: the highest total production is not the same as the highest yield. Finally, communicate the result with a clear chart, its units, time frame, and limitations. This sequence is our teaching framework, not a benchmark result from the three papers. Our data engineering pipeline makes these analytical steps reliable and repeatable. Next, we will look at an example of how the calculations work."},{"title":"From raw records to defensible insight","kind":"three","items":["MEASURE — production (MT), harvested area (ha), yield (MT/ha)","ANALYZE — group by province and commodity, aggregate and compare","CHECK — missing values, units, duplicate records, outliers"],"notes":"Imagine three fictional observations: Province A produced 1,000 metric tons from 500 hectares, or 2 metric tons per hectare. Province B produced 800 metric tons from 200 hectares, or 4 metric tons per hectare. Province A leads in total production, while Province B leads in calculated yield. This simple comparison shows why a good analyst chooses a measure that matches the question. At scale, we can express the same operations with SQL: group records by province and commodity, sum production and area, and calculate the ratio of summed production to summed area for the appropriate comparable crops and season. Do not average individual yields blindly if field sizes differ. Then check data quality, missing values, denominator zero, units, and whether the periods are comparable. These figures are illustrative and are not DA or research-study findings. We can later reproduce these steps on synthetic data in Databricks. With this process in mind, cloud computing provides the resources to do it at larger scale."},{"title":"Why cloud computing?","items":["On-demand compute and storage","Elasticity when workloads change","Managed infrastructure and shared access","Trade-offs: cost, connectivity, compliance, and vendor dependency"],"kind":"list","notes":"Cloud computing matters here because processing demands are not always constant. An office may only need routine reporting on ordinary days, but much more computing power during consolidation periods. Cloud platforms offer access to compute and storage on demand, and many provide managed services that reduce infrastructure work. However, 'cloud' does not mean automatically cheap, secure, or available during an internet outage. We still need to consider recurring charges, data protection, connectivity, and vendor dependence. In our topic, the cloud is a supporting environment; the central issue is how data is engineered and analyzed within it. To make that concrete, let's walk through a typical flow from source data to insights."},{"title":"From data to decisions","items":["Sources","Ingestion","Validation","Transformation","Storage","Analytics","Insights"],"kind":"flow","notes":"Please follow this flow from left to right. Sources could be operational databases, spreadsheets, APIs, or sensors. Ingestion brings records into a platform. Validation checks whether they satisfy required rules, such as having a known province and a sensible quantity. Transformation standardizes formats, handles duplicates, and calculates fields for analysis. Storage keeps raw and processed data in appropriate structures. Analytics then uses queries, aggregations, or models to answer questions. Finally, insights reach people through reports or dashboards. These stages may overlap in real systems, and storage may happen at several points, but the diagram gives us a useful mental model. If any stage is unreliable, the final decision may be unreliable too. So, who designs and operates this flow? That brings us to cloud data engineering."},{"title":"Cloud data engineering","items":["Build, operate, and monitor reliable data pipelines","Ingestion · Transformation · Orchestration","Quality checks · Governance","Engineering prepares data; analytics draws insights"],"kind":"list","notes":"An end-to-end pipeline should be observable and repeatable. Consider a nightly regional dataset import. The engineer defines the source schema, records when a file arrived, rejects impossible production values, applies a clear duplicate rule, and publishes a curated table only after quality thresholds pass. Orchestration schedules these dependent operations; monitoring alerts the team if a step fails. Analytics is downstream of these decisions. The separation is not a hard professional boundary—an analyst might write transformations too—but the responsibilities are distinct. We now look at data governance, because engineering must preserve not only usability but accountability."},{"title":"Governance, privacy, and data lineage","items":["QUALITY — validate completeness, accuracy, and consistency","ACCESS — authorize users and protect sensitive fields","LINEAGE — trace source → transformation → output","OPERATIONS — monitor jobs, failures, and costs"],"kind":"four","notes":"Before we discuss particular pipeline architectures, we need to understand the controls that make engineering trustworthy. Data quality means checking whether records are sufficiently complete, consistent, and plausible for their intended use. Access control means not everyone sees every field, especially when a dataset could identify individual farmers. Data lineage tells us where a number in a report came from, which transformations affected it, and which version was used. Finally, monitoring helps us detect failed jobs, delayed data, or unexpected processing costs. These are not just optional enterprise extras. Even a small academic pipeline benefits from validation, clear ownership, and a documented transformation path. In government settings, we must additionally follow the applicable privacy and records policies. The cloud gives us tools to implement these controls, but does not decide the policies for us. Next we will examine where transformation occurs in a data workflow."},{"title":"ETL and ELT","items":["ETL — Extract → Transform → Load","ELT — Extract → Load → Transform","Choose based on governance, systems, and workload"],"kind":"two","notes":"ETL means Extract, Transform, Load. We take data from its source, clean or reshape it, and then place the processed result into the destination. ELT means Extract, Load, Transform. Here we first load the raw or lightly processed data into the destination platform and transform it there. ELT can be attractive when a cloud analytics engine can process large stored datasets efficiently. ETL can be appropriate when the destination expects a carefully standardized structure or sensitive values need attention before loading. The key point is not that one approach is newer and therefore better. The right choice depends on compliance, cost, storage capabilities, and the processing workload. Regardless of which we choose, we also need to decide when data is processed. That leads to batch, streaming, and incremental workloads."},{"title":"Batch, streaming, and incremental","items":["Batch — Process a set of records periodically","Streaming — Process events as they arrive","Incremental — Process only new or changed data","Different latency and complexity requirements"],"kind":"three","notes":"Batch processing handles data in groups at scheduled intervals—for example, aggregating agricultural submissions every night. Streaming processing handles a continuing sequence of events, such as readings arriving from connected devices. Incremental processing means updating outputs using new or changed records instead of reprocessing the entire dataset. These ideas describe different aspects of a workflow: streaming is about arrival and latency, while incremental processing is about avoiding unnecessary recomputation. A system may combine them. We choose based on how quickly answers are needed, the size of the workload, and the operational complexity we can sustain. In our classroom simulation, we will start with a small batch for clarity. The next question is where to store and organize this data for analysis."},{"title":"How distributed processing works","items":["PARTITION — split a large dataset across workers","COMPUTE — process partitions in parallel","SHUFFLE — exchange data for joins and grouped summaries","COORDINATE — recover tasks and assemble results"],"kind":"four","notes":"An important point for our topic is that Big Data is often processed across multiple machines rather than on a single computer. A framework such as Apache Spark partitions a dataset so multiple worker tasks can operate on it. For example, workers may independently clean records belonging to different partitions. When we group production by province, the system may need to exchange data between workers in a step called a shuffle. A coordinating process schedules work and helps recover from certain task failures. Parallelism can accelerate suitable workloads, but network transfer, uneven partitions, and shuffle overhead also introduce costs. This explains why adding more machines does not automatically improve every job. The teaching demo later uses the PySpark API; it illustrates transformations, not a controlled distributed scaling benchmark. Now that we have this mental model, let us compare the different storage architectures that feed these operations."},{"title":"Warehouse vs. lake vs. lakehouse","items":["Warehouse — Curated structured analytics","Data lake — Scalable raw and varied data","Lakehouse — Lake flexibility plus table management and analytical capabilities","No architecture is universally best"],"kind":"three","notes":"A data warehouse is traditionally designed for curated, structured analytical data and reporting. A data lake emphasizes flexible storage of raw or varied formats, which is useful when we do not know all future analyses. A lakehouse attempts to combine the lake's flexible, often lower-cost storage with table-management capabilities associated with analytical databases, such as transactions and versioning. This is the subject of our second research paper. It is important not to say the lakehouse always wins. A small agency with well-structured reporting needs may be better served by a simpler warehouse. A lakehouse may introduce additional components and governance responsibilities. So rather than memorizing definitions, let's apply the trade-offs to our first scenario."},{"title":"Scenario 1 — Select an architecture","items":["A government agency combines databases, XLSX files, drone imagery, and sensor feeds from multiple regions.","Would you choose a warehouse, lake, or lakehouse?","Which factors would determine your choice?"],"kind":"scenario","notes":"Let's make this interactive. Imagine a government agency receiving database records, Excel files, drone imagery, and sensor feeds from different regions. Which would you recommend: a warehouse, a lake, or a lakehouse, and why? I'll give everyone a moment to think. [Pause for responses.] One defensible answer is a lakehouse, because it can retain varied raw formats while also supporting managed analytical tables. But a warehouse can still be reasonable if the immediate deliverable is structured reporting; a separate lake may be suitable for exploratory storage. The quality of your answer depends on your reasons: data formats, workloads, privacy, available skills, and budget. There isn't a single mandatory answer. Now let's see how recent researchers investigate these architectural and engineering questions."},{"title":"Research framework","items":["Paper 1 (2023) — Declarative data engineering","Paper 2 (2025) — Survey and experiments on lakehouse architectures","Paper 3 (2025) — Cloud-native proof of concept and benchmark","Complementary lenses, not an apples-to-apples benchmark"],"kind":"papers","notes":"We selected three studies published between 2023 and 2025. The first, by Armbrust and colleagues, discusses declarative data engineering pipelines. The second, by Harby and Zulkernine, surveys warehouses, lakes, and lakehouses and conducts experiments. The third, by AbouZaid and colleagues, designs and tests a cloud-native data platform. Notice that these are different kinds of evidence. We cannot compare a reported percentage from one study directly with an experiment from another as though they used the same hardware and workload. Instead, we will ask what each study adds to the larger workflow: pipelines, architecture, and deployment. Let's start with the pipeline problem described by the first paper."},{"title":"Paper 1 — Research problem","items":["Armbrust et al. (CIDR 2023), Making Data Engineering Declarative","Complex ETL/ELT dependency graphs are difficult to optimize and maintain","What changes when users declare desired pipeline outcomes?"],"kind":"research","notes":"The first paper is 'Making Data Engineering Declarative,' presented at CIDR in 2023. The authors describe cloud data preparation as a network of connected transformations. In engineering terms, this is often represented as a directed acyclic graph, or DAG: one output depends on one or more earlier steps. As pipelines grow, coordinating jobs, updating derived data, and handling errors become difficult. The paper asks what happens if engineers describe the required results rather than manually scripting each execution step. This is a concise two-page paper, so we should treat it as a discussion of system design and reported experience, not as a comprehensive independent benchmark. Let's look at the proposed approach."},{"title":"Paper 1 — Proposed direction","items":["Declarative pipelines based on maintained SQL views","Pipeline-wide orchestration and incrementalization","Quality expectations and CI/CD integration","Reported >50% cost reduction for a specified downstream ELT comparison — not a universal guarantee"],"kind":"list","notes":"The important idea in Armbrust and colleagues’ 2023 paper is declarative pipeline specification: an engineer describes the derived data that should exist, while the platform can handle aspects of execution planning and maintenance. Their discussion identifies ingestion, incrementalized downstream transformations, orchestration across a dependency graph, and expectations for data quality. One reported comparison claims more than 50 percent lower cost for pipeline-aware parallelism and autoscaling in a particular fully incremental downstream ELT setting than independently executed operations. We must state that narrow comparison accurately: it is neither a promised saving for all customers nor a controlled benchmark that we reproduced. In our planned demo, the conceptual analogue is declaring cleaned and aggregated tables, then rerunning the pipeline reliably."},{"title":"Paper 1 — Critical appraisal","items":["Strength: concrete engineering problems and system-level ideas","Limit: two-page paper with concise evidence and experimental context","Use for pipeline-design concepts; not a general comparative benchmark"],"kind":"research","notes":"This paper gives us a clear engineering insight: pipelines should be manageable as systems, not just collections of unrelated scripts. But there are limitations. The document is only two pages long, and it does not provide the same depth of experimental methodology as a full benchmarking study. Its authors also describe a technology they developed, so critical reading is important. We can use it to explain declarative design, incrementalization, data quality expectations, and orchestration. We should not use it alone to conclude that one vendor or platform is universally more efficient. Our next paper takes a broader look at the storage and analytical architectures those pipelines operate on."},{"title":"Paper 2 — Architecture comparison","items":["Harby & Zulkernine, Information Systems 127 (2025), 102460","Surveys data warehouses, data lakes, and lakehouses","Proposes a conceptual architecture and compares features","Experiments with IMDb query workloads"],"kind":"research","notes":"Our second paper, 'Data Lakehouse: A Survey and Experimental Study,' by Harby and Zulkernine, appeared in Information Systems, volume 127, in 2025. The authors discuss how data warehouses, data lakes, and lakehouses differ in storage, organization, metadata, security, and analytical capabilities. They propose a conceptual model for a lakehouse architecture and also evaluate actual systems. The architecture figure early in their paper is helpful because it shows different points where extraction, loading, and transformation occur. We should remember that a proposed model tells us which functions are desirable; empirical experiments tell us how particular implementations behaved. With that distinction, let's examine the experimental part."},{"title":"Paper 2 — Experimental results","items":["Compares HDFS data lake, Hive warehouse, and Delta lakehouse","Four analytical queries on an IMDb dataset","Observed benefits depend on query pattern, dataset size, and workload","Do not generalize to every system or dataset"],"kind":"research","notes":"This research is particularly relevant because it does more than describe lakehouses abstractly. Harby and Zulkernine compare HDFS as a data lake, Hive as a data warehouse, and Delta as a lakehouse, using four analytical queries over an IMDb dataset. When we evaluate the results, we must ask which query was run, how much data it scanned, and whether implementation or configuration explains the outcome. The paper does not establish that every lakehouse is faster than every warehouse. Its experiment illustrates why architecture decisions should be workload-specific. For our agricultural example, different query shapes—grouped totals versus complex joins—can also have different processing costs."},{"title":"Scenario 2 — Make data reliable","items":["Daily agricultural records contain duplicate IDs, missing provinces, and negative production values.","What validations and transformations would you implement before analytics?","What would you do with rejected records?"],"kind":"scenario","notes":"Here is our second scenario. Our system receives agricultural records every day, but some submissions have duplicate IDs, missing province names, or negative production values. What rules should we apply before those records appear in reports? [Pause and invite two approaches.] A good pipeline would check required fields, accepted province and commodity values, quantity ranges, and uniqueness rules. It should also choose a clear deduplication policy. Invalid records could be quarantined with an explanation so someone can review or correct them. We should measure how many records passed and failed each check. Simply deleting suspicious rows without an audit trail could hide a systematic problem. This is why engineering quality controls are necessary before analytics. Now let's see a study that assembles a whole platform to support this kind of work."},{"title":"Paper 3 — Practical architecture","items":["AbouZaid et al., Discover Applied Sciences 7:166 (2025)","Portable cloud-native lakehouse proof of concept","Kubernetes + Argo Workflows + MinIO + Dremio","Open formats and DataOps as design principles"],"kind":"platform","notes":"Here the researchers move from comparing categories to assembling a working platform. In AbouZaid and colleagues’ architecture, Kubernetes manages containerized infrastructure, Argo Workflows helps orchestrate tasks, MinIO provides object storage, and Dremio processes analytical queries. Apache Iceberg supplies open table-management capabilities. This is a composable, cloud-agnostic proof of concept, but composability brings operational responsibilities too: deployments, permissions, upgrades, monitoring and tuning. Notice that our future classroom Databricks exercise is intentionally simpler. It illustrates the pipeline concepts without replicating the paper’s entire Kubernetes deployment."},{"title":"Paper 3 — Evaluation and findings","items":["TPC-DS benchmarks and cold/warm query conditions","Dremio caching: 12% median query-duration improvement in the tested setup","Initial implementation and benchmarking — not proof of universal superiority"],"kind":"research","notes":"The third paper includes benchmarking based on TPC-DS, a decision-support workload suite. The authors compare cold and warm query conditions to evaluate caching behavior. Their abstract reports a 12 percent median improvement in query duration with caching in the evaluated setup. This is not a universal improvement across every platform or workload. Caching helps only under particular access patterns, and an initial proof of concept cannot by itself establish long-term reliability or operating cost in production. Still, the paper is valuable because it moves from architecture diagrams to an actual implementation and measurement. That gives us a practical complement to the pipeline and lakehouse papers. Let's now connect what we've learned from all three. It is also important to distinguish warm-cache results from cold-cache operation. If an organization has a different query mix or cache hit rate, the observed benefit could change. Their proof of concept informs feasibility and architecture—not an unconditional performance ranking."},{"title":"Research synthesis","items":["Paper 1 — How pipelines are specified and maintained","Paper 2 — How storage and analytics architectures differ","Paper 3 — How cloud-native components can be assembled","Shared concerns: quality, scalability, governance, cost, interoperability"],"kind":"papers","notes":"Let us synthesize rather than simply list the papers. The 2023 paper concentrates on defining and maintaining transformations. The lakehouse survey evaluates the architectural options and a specific set of analytical queries. The cloud-native platform study demonstrates how infrastructure, storage and query components can be integrated. They offer different kinds of evidence, so their percentage improvements cannot be compared head-to-head. For engineering practice, we would first describe business questions and data constraints, then choose a storage pattern and pipeline architecture, then test cost, correctness and performance with our real workload. This connects directly to our teaching scenario."},{"title":"Applied case — Agricultural analytics","items":["Synthetic Western Visayas crop data (not official statistics)","Raw ingestion → Bronze","Validate, quarantine, deduplicate → Silver","Summarize province/commodity results → Gold","Check counts and units before interpreting totals"],"kind":"medallion","notes":"Our planned agricultural dataset is synthetic, not official DA or RSBSA data. The engineering steps are straightforward but meaningful: Bronze retains raw submissions and ingestion context; Silver validates fields, handles duplicate records using a documented key, and quarantines rejected rows; Gold provides province-by-commodity summaries for reporting. As an analytics example, we could group by province and commodity, sum production in metric tons, and calculate production per hectare only when area is positive and units are consistent. We should report how many rows entered each layer to make the quality controls measurable. Those totals are useful descriptive analytics, not proof of a predictive model. This becomes the foundation for the later Databricks simulation."},{"title":"Scenario 3 — Choose a deployment","items":["A public agency handles sensitive farmer records, has limited funding, and faces intermittent connectivity.","Public cloud, on-premises, or hybrid?","Explain security, cost, continuity, and governance trade-offs."],"kind":"scenario","notes":"Our third and final scenario concerns an agency handling sensitive farmer information with limited funding and intermittent internet access. Would you choose on-premises infrastructure, public cloud, or a hybrid arrangement? [Pause for classmates.] A hybrid approach might be defensible if local data capture must continue offline while selected data is synchronized to a secure cloud analytical environment. But that creates integration work. An on-premises approach might fit strict local-control requirements but adds hardware and maintenance costs. Public cloud may reduce hardware procurement but still needs strong access controls, encryption, backups, legal compliance, and cost governance. The best answer identifies the data classification and constraints first, then justifies the architecture. No option removes the need for security or operational planning. Now I'll preview our eventual simulation."},{"title":"Simulation preview and takeaway","items":["Later demonstration: Databricks Free Edition","Load fictional data → PySpark cleaning → Delta tables → SQL chart","Useful analytics depend on sound engineering and architectural trade-offs"],"kind":"flow","notes":"For the later practical portion, we plan to use Databricks Free Edition as a teaching environment. We will load fictional agricultural records, apply cleaning rules with PySpark, store the results in Delta tables where permitted, and use SQL to generate a chart. This will illustrate concepts from the presentation: ingestion, transformation, quality checks, storage, and analytics. It is not a replication of the three published studies and will not prove that Databricks is the fastest system. A small educational workload mainly helps classmates see the pipeline operate step by step. We are deliberately keeping the demo separate until the slides and scripts are ready. Let's finish with the key message of the report."},{"title":"Conclusion","items":["Big Data is a management and analysis challenge — not only a storage problem","Cloud data engineering supplies reliable pipelines","Lakehouse patterns combine flexibility and managed analytics","Research findings are workload-specific; evaluate before adopting"],"kind":"closing","notes":"Our central conclusion is that large-scale analytics depends on the quality of the engineering that precedes it. Good systems ingest diverse sources, validate and transform records, manage data lineage, and make analytical outputs reproducible. A warehouse, lake, or lakehouse is a design choice, not a ranking in which one architecture always wins. The three papers help us see different parts of that decision: declarative pipelines, architecture comparisons and implementation of cloud-native components. Their reported performance results apply within particular experimental conditions. When our Databricks demonstration is ready, we can show these principles operating on a small synthetic dataset. Thank you, and I welcome your questions."},{"title":"References","items":["Armbrust, M., et al. (2023). Making data engineering declarative. CIDR 2023. cidrdb.org/cidr2023/papers/p95-papakonstantinou.pdf","Harby, A. A., & Zulkernine, F. (2025). Data lakehouse: A survey and experimental study. Information Systems, 127, 102460. doi.org/10.1016/j.is.2024.102460","AbouZaid, A., Barclay, P. J., Chrysoulas, C., & Pitropakis, N. (2025). Building a modern data platform based on the data lakehouse architecture and cloud-native ecosystem. Discover Applied Sciences, 7, 166. doi.org/10.1007/s42452-025-06545-w"],"kind":"refs","notes":"These are the three main references supporting today's report. The first is Armbrust and colleagues' 2023 CIDR paper, 'Making Data Engineering Declarative.' The second is Harby and Zulkernine's 2025 article, 'Data Lakehouse: A Survey and Experimental Study,' in Information Systems. The third is AbouZaid and colleagues' 2025 article in Discover Applied Sciences on a cloud-native lakehouse platform. For any numerical research claim, especially the reported cost improvement and caching result, please refer to the original paper and its experimental context. The agricultural scenario and the planned Databricks exercise are our educational examples, not results from those research studies. This concludes the formal presentation."}];

function attachFigure(){const figure=FIGURES[index+1];if(!figure)return;const el=document.querySelector('.slide');if(!el)return;el.classList.add('has-figure');const f=document.createElement('figure');f.className='figure-stage';f.innerHTML='<div class="visual-frame">'+figure.svg+'</div><figcaption>'+escapeHtml(figure.caption)+'</figcaption>';el.appendChild(f)}

const slides=SLIDE_DATA;let index=0;const app=document.getElementById('app');const escapeHtml=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const s=slides[index];let type=s.kind;let content='';const items=s.items;const formats={five:5,four:4,two:2,three:3,platform:4,medallion:3,papers:3};if(type==='flow'){content='<div class="flow">'+items.map((x,i)=>'<div class="tile"><strong>'+escapeHtml(x)+'</strong></div>'+(i<items.length-1?'<span class="arrow">→</span>':'')).join('')+'</div>'}else if(formats[type]){let list=type==='medallion'?items.slice(1,4):type==='papers'?items.slice(0,3):type==='platform'?items.slice(1):type==='five'?items.slice(1):type==='four'?items.slice(0,4):type==='two'?items.slice(0,2):items.slice(0,3);content='<div class="grid" style="--cols:'+Math.min(list.length,formats[type])+'">'+list.map(x=>{let p=x.split(/\s*[—–]\s*/);return '<div class="tile"><strong>'+escapeHtml(p[0])+'</strong>'+(p[1]?'<small>'+escapeHtml(p.slice(1).join(' — '))+'</small>':'')+'</div>'}).join('')+'</div>';let rest=items.filter(x=>!list.includes(x));if(rest.length) content+='<div class="content">'+rest.map(x=>'<p class="item">'+escapeHtml(x)+'</p>').join('')+'</div>'}else{content='<div class="content">'+items.map(x=>'<p class="item">'+escapeHtml(x)+'</p>').join('')+'</div>'};app.innerHTML='<div class="stage"><article class="slide '+type+'" role="group" aria-label="Slide '+(index+1)+' of '+slides.length+'"><div class="kicker">Big Data Analytics / Cloud-Based Data Engineering</div><h1 class="title">'+escapeHtml(s.title)+'</h1>'+content+'<div class="meta"><span>WEST VISAYAS STATE UNIVERSITY · MIT</span><span>'+String(index+1).padStart(2,'0')+' / '+slides.length+'</span></div></article></div><aside class="notes" aria-label="Presenter notes"><h2>Presenter notes · Slide '+(index+1)+'</h2>'+escapeHtml(s.notes)+'</aside>';attachFigure();document.getElementById('count').textContent=(index+1)+' / '+slides.length;document.getElementById('progress').style.width=((index+1)/slides.length*100)+'%';history.replaceState(null,'','#slide-'+(index+1));document.title=s.title+' — WVSU MIT'}function change(n){index=Math.max(0,Math.min(slides.length-1,index+n));render()}document.getElementById('prev').onclick=()=>change(-1);document.getElementById('next').onclick=()=>change(1);document.getElementById('toggle-notes').onclick=()=>{document.body.classList.toggle('show-notes');document.getElementById('toggle-notes').setAttribute('aria-pressed',document.body.classList.contains('show-notes'))};document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();change(1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();change(-1)}if(e.key==='Home'){index=0;render()}if(e.key==='End'){index=slides.length-1;render()}if(e.key.toLowerCase()==='n'){document.getElementById('toggle-notes').click()}});const m=location.hash.match(/slide-(\d+)/);if(m)index=Math.max(0,Math.min(slides.length-1,+m[1]-1));render();
// Dual-window presenter protocol. No server or third-party dependency.
const presenterMode=new URLSearchParams(location.search).has('presenter');
const channelName='gba-mit-presenter-v1';
let bus=null;try{if('BroadcastChannel' in window)bus=new BroadcastChannel(channelName)}catch(e){}
const syncKey='gba-mit-slide-sync';const presenterStateKey='gba-mit-presenter-state';let presenterPopup=null;let lastPresenterHeartbeat=0;function setPresenterActive(active){if(presenterMode)return;document.body.classList.toggle('audience-presenter-active',active);if(active){document.body.classList.remove('show-notes');document.getElementById('toggle-notes').setAttribute('aria-pressed','false')}}function handlePresenterState(packet){if(presenterMode||!packet)return;if(packet.kind==='presenter-open'){lastPresenterHeartbeat=Date.now();setPresenterActive(true)}else if(packet.kind==='presenter-close'){lastPresenterHeartbeat=0;setPresenterActive(false)}}function emitPresenterState(kind){const packet={kind,at:Date.now()};if(bus)bus.postMessage(packet);try{localStorage.setItem(presenterStateKey,JSON.stringify(packet))}catch(e){}}let version=Date.now();let applyingRemote=false;
const priorRender=render;render=function(){priorRender();if(presenterMode)drawPresenter();if(!applyingRemote)broadcastPosition()};
function broadcastPosition(){version=Math.max(Date.now(),version+1);const packet={kind:'position',index,version};if(bus)bus.postMessage(packet);try{localStorage.setItem(syncKey,JSON.stringify(packet))}catch(e){}}
function acceptPosition(packet){if(!packet||packet.kind!=='position'||!Number.isInteger(packet.index)||packet.version<=version)return;version=packet.version;index=Math.max(0,Math.min(slides.length-1,packet.index));applyingRemote=true;render();applyingRemote=false;}
if(bus)bus.onmessage=e=>{if(e.data?.kind==='request'){broadcastPosition()}else if(e.data?.kind==='presenter-open'||e.data?.kind==='presenter-close'){handlePresenterState(e.data)}else acceptPosition(e.data)};
window.addEventListener('storage',e=>{if(e.key===syncKey&&e.newValue){try{acceptPosition(JSON.parse(e.newValue))}catch(err){}}if(e.key===presenterStateKey&&e.newValue){try{handlePresenterState(JSON.parse(e.newValue))}catch(err){}}});
function previewItems(slide){return slide.items.map(x=>'<p>'+escapeHtml(x)+'</p>').join('')}
function drawPresenter(){const current=slides[index],next=slides[index+1];document.getElementById('current-title').textContent=current.title;document.getElementById('current-summary').innerHTML=previewItems(current);document.getElementById('upnext-title').textContent=next?next.title:'End of presentation';document.getElementById('upnext-summary').innerHTML=next?previewItems(next):'<p>You have reached the end.</p>';document.getElementById('presenter-notes').textContent=current.notes;document.getElementById('p-count').textContent=(index+1)+' / '+slides.length;document.getElementById('presenter-notes').scrollTop=0;}
if(presenterMode){document.body.classList.add('presenter-window');document.getElementById('p-prev').onclick=()=>change(-1);document.getElementById('p-next').onclick=()=>change(1);let timerStart=Date.now();const clock=document.getElementById('presenter-clock');function tick(){const seconds=Math.floor((Date.now()-timerStart)/1000);clock.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}tick();setInterval(tick,1000);document.getElementById('p-reset').onclick=()=>{timerStart=Date.now();tick()};drawPresenter();emitPresenterState('presenter-open');setInterval(()=>emitPresenterState('presenter-open'),1200);window.addEventListener('pagehide',()=>emitPresenterState('presenter-close'));if(bus)bus.postMessage({kind:'request'});}
else{document.getElementById('open-presenter').onclick=()=>{const url=new URL(location.href);url.searchParams.set('presenter','1');const w=window.open(url.href,'GBA_Presenter','width=1320,height=840,menubar=no,toolbar=no');if(!w)alert('Your browser blocked the presenter window. Allow pop-ups for this file/site, then try again. You can also open this URL manually: '+url.href);else{presenterPopup=w;setPresenterActive(true);w.focus()}};setInterval(()=>{if(presenterPopup&&presenterPopup.closed){presenterPopup=null;lastPresenterHeartbeat=0;setPresenterActive(false)}else if(document.body.classList.contains('audience-presenter-active')&&Date.now()-lastPresenterHeartbeat>4500&&(!presenterPopup||presenterPopup.closed)){setPresenterActive(false)}},1200);}
// P launches speaker window from the audience. Escape exits speaker popup only.
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;if((e.key==='p'||e.key==='P')&&!presenterMode){document.getElementById('open-presenter').click()}if(e.key==='Escape'&&presenterMode)window.close()});
